[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "israeli-pension-scrapers"
dynamic = ["version"]
description = "Unified async Python scrapers for Israeli pension, keren hishtalmut, kupat gemel, and long-term savings providers"
readme = "README.md"
authors = [
    { name = "Shai Cohen", email = "shai@cohens.dev" }
]
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/RebliNk17/israeli-pension-scrapers"
Repository = "https://github.com/RebliNk17/israeli-pension-scrapers"
Issues = "https://github.com/RebliNk17/israeli-pension-scrapers/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.semantic_release]
major_on_zero = false
allow_zero_version = true
tag_format = "v{version}"
commit = false

[tool.semantic_release.branches.master]
match = "master"
prerelease = false

[tool.hatch.build.targets.wheel]
packages = ["src/israeli_pension_scrapers"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
fallback_version = "0.2.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
