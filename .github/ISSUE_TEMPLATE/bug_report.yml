name: Bug report
description: A provider scraper or parser isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste credentials, ID numbers, tokens, policy numbers or unredacted payloads.**
        Security issues go to SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Pension / insurance provider (e.g. haphoenix, migdal)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback (redacted)
      render: text
