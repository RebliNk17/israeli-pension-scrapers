name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish current version to PyPI regardless of new release tag"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release & Publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/israeli-pension-scrapers
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run test suite
        run: |
          uv sync --frozen
          uv run pytest -q

      - name: Detect next semantic version
        id: versioning
        run: |
          LAST_TAG=$(uv tool run python-semantic-release version --print-last-released-tag 2>/dev/null || echo "")
          NEXT_TAG=$(uv tool run python-semantic-release --noop version --print-tag 2>/dev/null || echo "")
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "next_tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"

          if [ -n "$NEXT_TAG" ] && [ "$NEXT_TAG" != "$LAST_TAG" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
            echo "Will release $NEXT_TAG (previous: $LAST_TAG)"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No new version to release (current: $LAST_TAG)"
          fi

      - name: Create and push Git tag
        if: steps.versioning.outputs.released == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.versioning.outputs.tag }}"
          git push origin "${{ steps.versioning.outputs.tag }}"

      - name: Build distribution packages
        if: steps.versioning.outputs.released == 'true' || inputs.force_publish == true
        run: |
          rm -rf dist/
          uv build

      - name: Create GitHub Release
        if: steps.versioning.outputs.released == 'true'
        run: |
          gh release create "${{ steps.versioning.outputs.tag }}" dist/* \
            --title "${{ steps.versioning.outputs.tag }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: steps.versioning.outputs.released == 'true' || inputs.force_publish == true
        uses: pypa/gh-action-pypi-publish@release/v1
